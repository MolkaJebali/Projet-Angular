<section class="organizers-section mt-5" aria-labelledby="organizers-title">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end mb-4 gap-2">
    <div>
      <h2 id="organizers-title" class="h3 fw-bold mb-1">Organisateurs ({{ organizers.length }})</h2>
      <p class="text-body-secondary mb-0">Les personnes qui rendent ces événements possibles.</p>
    </div>
  </div>

  <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4">
    @for (organizer of organizers; track organizer.id) {
      <div class="col">
        <article class="card organizer-card h-100 border-0 shadow-sm text-center">
          <div class="card-body d-flex flex-column align-items-center p-4">
            <img
              class="organizer-picture mb-3"
              [src]="organizer.picture"
              [alt]="'Portrait de ' + organizer.name"
            >
            <h3 class="h5 card-title fw-bold mb-2">{{ organizer.name }}</h3>
            <a class="organizer-email mb-2" [href]="'mailto:' + organizer.email">
              {{ organizer.email }}
            </a>
            <p class="text-body-secondary small mb-0">{{ organizer.university }}</p>
          </div>
        </article>
      </div>
    } @empty {
      <p class="text-body-secondary">Aucun organisateur disponible.</p>
    }
  </div>
</section>
